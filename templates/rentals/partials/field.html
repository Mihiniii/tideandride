<div class="field{% if field.errors %} field--error{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="opt">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="help">{{ field.help_text|safe }}</p>{% endif %}
  {% for e in field.errors %}<p class="err">{{ e }}</p>{% endfor %}
</div>
